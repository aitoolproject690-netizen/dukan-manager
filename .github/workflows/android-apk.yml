name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ui-overhaul-v1

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
    defaults:
      run:
        working-directory: Dukaan-Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Clean generated Android project
        run: rm -rf artifacts/mobile/android

      - name: Generate fresh native Android project
        run: CI=1 pnpm --filter @workspace/mobile exec expo prebuild --platform android --clean --no-install

      - name: Verify stale Worklets native library is absent
        run: |
          if find artifacts/mobile/android -type f -name '*worklets*' | grep -q .; then
            echo 'ERROR: stale react-native-worklets native files remain in generated Android project.'
            find artifacts/mobile/android -type f -name '*worklets*'
            exit 1
          fi

      - name: Build release APK
        working-directory: Dukaan-Dashboard/artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK does not contain stale Worklets native library
        working-directory: Dukaan-Dashboard
        run: |
          APK=$(find artifacts/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          unzip -l "$APK" | grep -q 'libworklets.so' && { echo 'ERROR: APK still contains libworklets.so'; exit 1; } || true
          echo "Verified APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-manager-release-apk
          path: Dukaan-Dashboard/artifacts/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
