name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ui-overhaul-v1

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NODE_ENV: production
      ANDROID_PACKAGE: com.dukkaan.manager
    defaults:
      run:
        working-directory: Dukaan-Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter @workspace/mobile typecheck

      - name: Validate Android production bundle
        run: rm -rf /tmp/dukaan-export && CI=1 pnpm --filter @workspace/mobile exec expo export --platform android --output-dir /tmp/dukaan-export

      - name: Clean generated Android project
        run: rm -rf artifacts/mobile/android

      - name: Generate fresh native Android project
        run: CI=1 pnpm --filter @workspace/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: Dukaan-Dashboard/artifacts/mobile/android
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK exists
        run: |
          APK=$(find artifacts/mobile/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "Verified release APK: $APK"

      - name: Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -u
            APK="$GITHUB_WORKSPACE/Dukaan-Dashboard/artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk"
            echo "--- INSTALL APK ---"
            adb install -r "$APK"
            adb shell am force-stop "$ANDROID_PACKAGE"
            adb logcat -c
            echo "--- LAUNCH APK ---"
            adb shell am start -W -n "$ANDROID_PACKAGE/.MainActivity"
            sleep 30
            echo "--- TOP ACTIVITY ---"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            echo "--- PACKAGE STATE ---"
            adb shell dumpsys package "$ANDROID_PACKAGE" | grep -E "versionName|versionCode|enabled=true|Activity" | head -n 30 || true
            echo "--- PROCESS ---"
            if ! adb shell pidof "$ANDROID_PACKAGE" | grep -Eq '[0-9]+'; then
              echo "APP PROCESS NOT RUNNING"
              echo "--- ERROR LOGCAT ---"
              adb logcat -d -b all -v time | grep -E "($ANDROID_PACKAGE|AndroidRuntime|ReactNative|ReactNativeJS|FATAL|Fatal|Exception|SIG)" | tail -n 1000 || true
              exit 1
            fi
            echo "--- CRASH CHECK ---"
            LOG=/tmp/dukaan-logcat.txt
            adb logcat -d -b all -v time > "$LOG"
            if grep -Eq "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: $ANDROID_PACKAGE .*has died|Fatal signal|ReactNativeJS.*(Error|Invariant Violation)|Expo native runtime is not available|Module AppRegistry is not a registered callable" "$LOG"; then
              echo "ANDROID RUNTIME CRASH DETECTED"
              grep -E "($ANDROID_PACKAGE|AndroidRuntime|ReactNative|ReactNativeJS|FATAL|Fatal|Exception|SIG|AppRegistry|Expo native runtime)" "$LOG" | tail -n 1000 || true
              exit 1
            fi
            echo "Android launch smoke test passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-manager-release-apk
          path: Dukaan-Dashboard/artifacts/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
