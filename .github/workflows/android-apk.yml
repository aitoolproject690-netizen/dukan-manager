name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ui-overhaul-v1

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Dukaan-Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Dukaan-Dashboard/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: pnpm --filter @workspace/mobile exec expo prebuild --platform android --non-interactive --no-install

      - name: Build release APK
        working-directory: Dukaan-Dashboard/artifacts/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-manager-release-apk
          path: Dukaan-Dashboard/artifacts/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
