name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - ui-overhaul-v1

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
      ANDROID_PACKAGE: com.dukkaan.manager
    defaults:
      run:
        working-directory: Dukaan-Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck mobile
        run: pnpm --filter @workspace/mobile typecheck

      - name: Validate Android production bundle
        run: rm -rf /tmp/dukaan-export && CI=1 pnpm --filter @workspace/mobile exec expo export --platform android --output-dir /tmp/dukaan-export

      - name: Clean generated Android project
        run: rm -rf artifacts/mobile/android

      - name: Generate fresh native Android project
        run: CI=1 pnpm --filter @workspace/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: Dukaan-Dashboard/artifacts/mobile/android
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Verify APK exists
        run: |
          APK=$(find artifacts/mobile/android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "Verified release APK: $APK"

      - name: Android emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r "$GITHUB_WORKSPACE/Dukaan-Dashboard/artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk"
            adb shell am force-stop "$ANDROID_PACKAGE"
            adb logcat -c
            adb shell monkey -p "$ANDROID_PACKAGE" 1
            sleep 20
            echo "--- TOP ACTIVITY ---"
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            echo "--- PROCESS ---"
            adb shell pidof "$ANDROID_PACKAGE" >/dev/null || { echo "APP PROCESS NOT RUNNING"; adb logcat -d -v time | tail -n 500; exit 1; }
            echo "--- CRASH CHECK ---"
            adb logcat -d -v time > /tmp/dukaan-logcat.txt
            if grep -Eq "FATAL EXCEPTION|AndroidRuntime.*FATAL|Process: $ANDROID_PACKAGE .*has died|Fatal signal" /tmp/dukaan-logcat.txt; then
              echo "ANDROID RUNTIME CRASH DETECTED"
              tail -n 500 /tmp/dukaan-logcat.txt
              exit 1
            fi
            echo "Android launch smoke test passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-manager-release-apk
          path: Dukaan-Dashboard/artifacts/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
